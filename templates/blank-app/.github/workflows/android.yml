name: Android CI/CD Auto-Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Parse Metadata from config.gradle
      id: get_metadata
      run: |
        VERSION_NAME=$(grep "versionName" config.gradle | head -n 1 | awk -F'"' '{print $2}')
        echo "VERSION=$VERSION_NAME" >> $GITHUB_OUTPUT

    - name: Prepare APK Product
      run: |
        SAFE_NAME="${{ github.event.repository.name }}"
        VERSION="${{ steps.get_metadata.outputs.VERSION }}"
        cp app/build/outputs/apk/debug/app-debug.apk "${SAFE_NAME}-v${VERSION}.apk"
        echo "APK_PATH=${SAFE_NAME}-v${VERSION}.apk" >> $GITHUB_ENV

    - name: Create GitHub Release and Upload APK
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.get_metadata.outputs.VERSION }}
        name: "${{ github.event.repository.name }} v${{ steps.get_metadata.outputs.VERSION }}"
        files: ${{ env.APK_PATH }}
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
