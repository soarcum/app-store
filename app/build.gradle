plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// 💡 引入根目录的全局配置中心
apply from: '../config.gradle'

// 💡 编译期安全读取 GitHub 凭证。优先从环境变量读取（适配 CI），其次读取本地文件，若均为空则抛出致命错误阻断编译，防止生成无 Token 的损坏版本
def getGithubToken() {
    // 1. 优先读取系统环境变量（适配 GitHub Actions CI/CD 流水线）
    def envToken = System.getenv("GITHUB_TOKEN")
    if (envToken != null && !envToken.trim().isEmpty()) {
        return envToken.trim()
    }
    
    // 2. 其次尝试读取本地根目录的 .github_token 文件
    def tokenFile = rootProject.file('.github_token')
    if (tokenFile.exists()) {
        def fileToken = tokenFile.text.trim()
        if (!fileToken.isEmpty()) {
            return fileToken
        }
    }
    
    // 3. 致命防呆拦截：若两者都为空，直接抛出编译异常，强行终止打包
    throw new org.gradle.api.GradleException(
        "\n=========================================================================\n" +
        "❌ [CRITICAL ERROR] 编译被拦截：未检测到任何有效的 GitHub Token 凭证！\n\n" +
        "原因：本项目是完全由数据驱动的私有商店，必须注入有效的 Token 才能正常加载数据和下载 APK。\n" +
        "解决办法：\n" +
        "  👉 [本地开发]：请在项目根目录下创建一个名为 '.github_token' 的文件，并粘贴您的 GitHub 个人访问令牌（PAT，具有 repo 只读权限）。\n" +
        "  👉 [云端编译 (GitHub Actions)]：请在您的 GitHub 仓库的 Settings -> Secrets and variables -> Actions 中添加一个名为 'PERSONAL_ACCESS_TOKEN' 的 Repository Secret，云端脚本会自动将其作为环境变量注入编译。\n" +
        "========================================================================="
    )
}

android {
    namespace rootProject.ext.applicationId
    compileSdk 34

    defaultConfig {
        applicationId rootProject.ext.applicationId
        minSdk 24
        targetSdk 34
        versionCode rootProject.ext.versionCode
        versionName rootProject.ext.versionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }

        // 💡 动态注入编译期常量，供自动更新模块 UpdateManager 读取，避免硬编码
        buildConfigField "String", "GITHUB_OWNER", "\"${rootProject.ext.githubOwner}\""
        buildConfigField "String", "GITHUB_REPO", "\"${rootProject.ext.githubRepo}\""
        buildConfigField "String", "GITHUB_TOKEN", "\"${getGithubToken()}\""
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        compose true
        buildConfig true // 💡 启用 BuildConfig 功能，使 UpdateManager 动态读取 GitHub 仓库配置
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.8'
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    // 基础 Android 核心和生命周期依赖
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.activity:activity-compose:1.8.2'
    
    // Jetpack Compose 官方推荐的 BOM 依赖声明
    implementation platform('androidx.compose:compose-bom:2024.02.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.navigation:navigation-compose:2.7.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'
    implementation 'androidx.compose.material:material-icons-extended'

    // OkHttp (自动更新从 GitHub 稳定高速拉取 APK 所必需)
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20231013'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation platform('androidx.compose:compose-bom:2024.02.00')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
