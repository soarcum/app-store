plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// 💡 引入根目录的全局配置中心
apply from: '../config.gradle'

// 💡 公开仓库自适应：因为仓库已设置为公开（Public），自动更新模块支持在无需 GitHub Token 的匿名公开模式下完美运作，从而彻底消灭安全隐患
def getGithubToken() {
    return ""
}

android {
    namespace rootProject.ext.applicationId
    compileSdk 34

    defaultConfig {
        applicationId rootProject.ext.applicationId
        minSdk 24
        targetSdk 34
        versionCode rootProject.ext.versionCode
        versionName rootProject.ext.versionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }

        // 💡 动态注入编译期常量，供自动更新模块 UpdateManager 读取，避免硬编码
        buildConfigField "String", "GITHUB_OWNER", "\"${rootProject.ext.githubOwner}\""
        buildConfigField "String", "GITHUB_REPO", "\"${rootProject.ext.githubRepo}\""
        buildConfigField "String", "GITHUB_TOKEN", "\"${getGithubToken()}\""
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        compose true
        buildConfig true // 💡 启用 BuildConfig 功能，使 UpdateManager 动态读取 GitHub 仓库配置
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.8'
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    // 基础 Android 核心和生命周期依赖
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.activity:activity-compose:1.8.2'
    
    // Jetpack Compose 官方推荐的 BOM 依赖声明
    implementation platform('androidx.compose:compose-bom:2024.02.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.navigation:navigation-compose:2.7.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'
    implementation 'androidx.compose.material:material-icons-extended'

    // OkHttp (自动更新从 GitHub 稳定高速拉取 APK 所必需)
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20231013'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation platform('androidx.compose:compose-bom:2024.02.00')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
